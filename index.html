<!doctype html>
<html lang="en" data-theme="ember" data-accent="coral">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/konsou.svg" />
    <!-- interactive-widget=resizes-content fixes the Android soft-keyboard layout shift (Trap 2) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#131b16" />
    <title>Konsou</title>
    <!-- The Field Guide's two voices: EB Garamond (engraved species names +
         italic binomials) and Courier Prime (typewritten labels + accession
         numbers). Self-hosting these is a follow-up for full offline fidelity. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
