<!doctype html>
<!-- The default world, stamped here so the first paint is already Lantern
     rather than flashing an unthemed page before the settings store loads.
     The store corrects it on load if the user picked Neon. -->
<html lang="en" data-theme="lantern">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/konsou.svg" />
    <!-- interactive-widget=resizes-content fixes the Android soft-keyboard layout shift (Trap 2) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1c0f11" />
    <title>Konsou</title>
    <!-- The two voices of both worlds: Space Grotesk carries the reading and
         display type, IBM Plex Mono carries labels, counts and eyebrow chips.
         Self-hosting these is a follow-up for full offline fidelity. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
