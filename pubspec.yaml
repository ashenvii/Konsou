name: konsou
description: "Offline-first anime tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  clock: ^1.1.3
  crypto: ^3.0.8
  drift: ^2.35.3
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  http: ^1.6.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  shared_preferences: ^2.5.6
  sqlite3: ^3.9.1
  url_launcher: ^6.3.3
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: false
  fonts:
    - family: PlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
